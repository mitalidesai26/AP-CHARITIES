<!DOCTYPE html>
<html lang="en">
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate - AP Charities</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        header {
            background-color: #FFFFFF;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            flex-wrap: wrap;
        }

        .container {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            flex-wrap: wrap;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            color: black;
            background-color: #eb072d;
            border: 2px solid #6531f3;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #c00624;
        }
    </style>
</head>

<body>
    <header>
        <div class="container-fluid">
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <img src="logo.png" alt="AP Charities Logo" style="height: 50px; margin-left: 20px;">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="home.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="about_us.html">About</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="contact_us.html">Contact</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="donate.html">donate</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="event.html">Events</a>
                        </li>
                        <li>
                            <a class="nav-link" href="tearms&condition.html"> Tearms & Condition</a>
                        </li>
                        <li>
                            <a class="nav-link" href="login.html"> <button>Login</button></a>
                        </li>
                    </ul>
                </div>
        </div>
        </nav>
    </header>
    <main class="bg-light">


        <div class="container py-5">
            <div class="row justify-content-center">

                <!-- Product Card -->
                <div class="col-md-4">
                    <div class="card shadow-sm">
                        <img src="donate.png" class="card-img-top" alt="Product Image">
                        <div class="card-body text-center">
                            <h5 class="card-title">Donations</h5>
                            <p class="card-text text-success fw-bold">Starting from 1$</p>
                            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#donateModal">
                                Donate Now
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>


        <!-- Donation Modal -->
        <div class="modal fade" id="donateModal" tabindex="-1" aria-labelledby="donateModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form>
                        <div class="modal-header">
                            <h5 class="modal-title" id="donate">Donate </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>

                        <div class="modal-body">
                            <!-- Customer Info -->
                            <div class="mb-3">
                                <label for="name" class="form-label">Full Name</label>
                                <input type="text" id="name" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" id="email" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label for="address" class="form-label">Address</label>
                                <textarea id="address" class="form-control" rows="2" required></textarea>
                            </div>

                            <!-- Payment Info -->
                            <div class="mb-3">
                                <label for="card" class="form-label">Credit Card Number</label>
                                <input type="text" id="card" class="form-control" placeholder="xxxx-xxxx-xxxx-xxxx"
                                    required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="expiry" class="form-label">Expiry Date</label>
                                    <input type="text" id="expiry" class="form-control" placeholder="MM/YY" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="cvv" class="form-label">CVV</label>
                                    <input type="text" id="cvv" class="form-control" placeholder="123" required>
                                </div>
                            </div>

                        </div>

                        <div class="modal-footer">
                            <button type="submit" class="btn btn-success w-100" onclick="myFunction()">Confirm &
                                Pay</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script>
            function myFunction() {
                var txt;
                // Show confirm dialog
                if (confirm("complete your donation?")) {
                    txt = "you have completed your donation successfully!";
                } 
                // Display message in an alert box
                window.confirm(txt);
            }
        </script>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    </main>
    <footer class="bg-light text-center text-lg-start rd-mt-6">
        <div class="text-center p-3" style="background-color:#ec0707; color: white;">
            © 2024 AP Charities. All rights reserved.
        </div>
    </footer>
</body>

</html>
