<!DOCTYPE html>
<html lang="en">    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AP Charities</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;     
        }
        .container {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }       
        label {
            display: block; 
            margin-bottom: 5px;
            color: #555;
        }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 8px;   
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #ec0707;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;    
        }
        button:hover {
            background-color: rgb(8, 237, 92);
            text-decoration: rgba(69, 185, 69, 0.012);
        }
    </style>
</head>
<body>
    <header>
        <div class="topbar">
            <div class="container">
                <h1>AP Charities</h1>
            </div>
        </div>
        <nav>
            <div class="container">
                <a href="1-useside.html">Home</a>
                <a href="Login_userside.html">Login</a>
                <a href="register.html">Register</a>
            </div>
        </nav>
    </header>
    <div class="container">
        <h2>Register for AP Charities</h2>
        <form action="/register" method="post">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit"><a href="1-useside.html">Register</a></button>
        </form>
    </div>
</body>
</html>
